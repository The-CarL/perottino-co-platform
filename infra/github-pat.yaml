AWSTemplateFormatVersion: '2010-09-09'
Description: Retained credential slot for the Perottino & Co. projects Git worker.
Resources:
  ProjectsGitToken:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /perottino-co/github/pat
      Description: Fine-grained GitHub token for The-CarL/perottino-co-projects. Owner supplies the value separately.
Outputs:
  ProjectsGitTokenArn:
    Description: Secret reference for a future Git worker IAM policy.
    Value: !Ref ProjectsGitToken
