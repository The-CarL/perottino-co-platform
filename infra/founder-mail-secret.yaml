AWSTemplateFormatVersion: '2010-09-09'
Description: Enroll the founder mailbox and generate its private routing capability in Secrets Manager.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  FounderEmail:
    Type: String
    NoEcho: true
    MaxLength: 254
    Description: Exact founder mailbox authorized for instructions to the CEO.
    AllowedPattern: >-
      (?=[^@]{1,64}@)[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[A-Za-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}
  VerifySandboxRecipient:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Set true with founder consent to send one SES address-verification email upon identity creation.
Conditions:
  EnrollRecipient: !Equals [!Ref VerifySandboxRecipient, 'true']
Resources:
  FounderMail:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: The ingress and sender authenticate founder mail across successive runtime deployments.
        must:
          - The 52-character token stays in Secrets Manager and the protected founder contact.
          - Changing the enrolled address or generator settings issues a new contact.
    Properties:
      Description: Private founder mailbox and CEO email routing capability.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"address":"${FounderEmail}"}'
        GenerateStringKey: token
        PasswordLength: 52
        ExcludeUppercase: true
        ExcludePunctuation: true
        ExcludeCharacters: '0189'
        IncludeSpace: false
        RequireEachIncludedType: false
      Tags:
        - {Key: 'perottino:purpose', Value: founder-mail}
  FounderRecipient:
    Type: AWS::SES::EmailIdentity
    Condition: EnrollRecipient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref FounderEmail
Outputs:
  OwnerMailSecretArn:
    Description: Supply this reference to the mail stack in the same account and region.
    Value: !Ref FounderMail
