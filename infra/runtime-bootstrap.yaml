AWSTemplateFormatVersion: '2010-09-09'
Description: Per-account image registry for Lambda and Fargate and an owner verifier slot.
Parameters:
  ProjectScope:
    Type: String
    MinLength: 38
    MaxLength: 52
    AllowedPattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}-[a-z][a-z0-9-]*'
    Description: Value of factory:s in the target deployment provenance.
Resources:
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: perottino:purpose
          Value: runtime-images
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factory-${ProjectScope}-r-a'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factory-${ProjectScope}-r-e'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factory-${ProjectScope}-r-f'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factory-${ProjectScope}-r-m'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:factory-${ProjectScope}-r-o'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
  ConsoleOwner:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: perottino:purpose
          Value: owner-verifier
      Description: Separately populated owner verifier JSON containing username and passwordHash.
Outputs:
  ImageRepositoryUri:
    Value: !GetAtt [Images, RepositoryUri]
  ImageRepositoryName:
    Value: !Ref Images
  OwnerSecretArn:
    Value: !Ref ConsoleOwner
