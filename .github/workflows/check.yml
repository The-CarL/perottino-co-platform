name: Platform checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:bc216b4351fab2299ed73511118405721ecc6e26d9a231344b08dc3e8bdddcaf
        ports:
          - 127.0.0.1:8000:8000
    env:
      PEROTTINO_AGENT_MODE: local
      PEROTTINO_DDB_TEST_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run check
      - name: Validate hosted, foundation and bootstrap CloudFormation schemas
        run: >-
          pipx run --spec cfn-lint==1.45.0 cfn-lint --non-zero-exit-code error -t
          cdk.hosted.out/Hosted.template.json cdk.out/Foundation.template.json
          infra/runtime-bootstrap.yaml infra/github-pat.yaml infra/inbound-email.yaml
  runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Build single-architecture Lambda and Fargate release images
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --load --file Dockerfile.lambda --tag perottino-lambda:ci .
          docker buildx build --platform linux/amd64 --provenance=false --load --file Dockerfile --tag perottino-worker:ci .
      - name: Exercise the packaged owner API, factory and resident employee with DynamoDB Local
        env:
          DYNAMODB_LOCAL_IMAGE: amazon/dynamodb-local@sha256:bc216b4351fab2299ed73511118405721ecc6e26d9a231344b08dc3e8bdddcaf
        run: |
          docker pull "$DYNAMODB_LOCAL_IMAGE"
          node scripts/check-image.mjs perottino-worker:ci perottino-lambda:ci "$DYNAMODB_LOCAL_IMAGE"
