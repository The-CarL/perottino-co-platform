name: Platform checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PEROTTINO_AGENT_MODE: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run check
      - name: Validate hosted, foundation and bootstrap CloudFormation schemas
        run: >-
          pipx run --spec cfn-lint==1.45.0 cfn-lint --non-zero-exit-code error -t
          cdk.hosted.out/Hosted.template.json cdk.out/Foundation.template.json
          infra/runtime-bootstrap.yaml infra/github-pat.yaml
      - name: Build the pinned TLS proxy
        run: docker build --platform linux/amd64 --file infra/Proxy.Dockerfile --tag perottino-proxy:ci .
      - name: Check the synthesized HTTPS proxy command
        run: node scripts/check-proxy.mjs perottino-proxy:ci cdk.hosted.out/Hosted.template.json
  runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Build the production image
        run: docker build --platform linux/amd64 --tag perottino-platform:ci .
      - name: Exercise the packaged app, persisted storage, browser and inference worker
        run: node scripts/check-image.mjs perottino-platform:ci
