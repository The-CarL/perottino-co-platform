<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <title>Company chat · Perottino &amp; Co.</title>
  <link rel="stylesheet" href="/chat.css">
  <script defer src="/chat.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icons" aria-hidden="true">
    <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="m18 3 3 3-9 9-4 1 1-4z"/></symbol>
    <symbol id="i-directory" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14.5" height="17" rx="2"/><circle cx="12" cy="9.3" r="2.2"/><path d="M8.8 16c.2-3.4 6.2-3.4 6.4 0M3.2 8H6m-2.8 8H6"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M4 5.8a2 2 0 0 1 2-2h5a3 3 0 0 1 2 1 3 3 0 0 1 2-1h4a1 1 0 0 1 1 1v13.9a1 1 0 0 1-1 1h-4a3 3 0 0 0-2 .9 3 3 0 0 0-2-.9H6a2 2 0 0 1-2-2zM13 5v15"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.6"/><path d="m16 16 4.8 4.8"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/><path d="M12 14v2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.6 20v-1.6a6.4 6.4 0 0 1 12.8 0V20"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  </svg>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Company chat navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P<span>.</span></div>
        <strong>Perottino &amp; Co.</strong>
        <button type="button" id="closeSidebar" class="icon-button mobile-only" aria-label="Close navigation"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sidebar-body">
        <h2>Company chat</h2>
        <button type="button" class="primary new-message" id="newMessage"><svg><use href="#i-compose"/></svg>New message</button>
        <div class="list-heading"><h3>Direct messages</h3></div>
        <nav id="conversations" aria-label="Direct messages"></nav>
      </div>
      <div class="owner-block"><div class="owner-avatar"><svg><use href="#i-person"/></svg></div><div><strong>Owner</strong><small id="runtime">Workspace owner</small></div><svg aria-hidden="true" class="owner-lock"><use href="#i-lock"/></svg></div>
    </aside>
    <button type="button" id="sidebarShade" class="shade" aria-label="Close navigation" hidden></button>
    <main class="chat" aria-label="Conversation">
      <header class="chat-header">
        <button class="icon-button mobile-only" type="button" id="openSidebar" aria-label="Open chat navigation" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        <div class="avatar header-avatar" aria-hidden="true" id="headerAvatar">·</div>
        <div class="header-contact"><h1 id="contactName">Company chat</h1><p id="contactMeta">Private workspace</p></div>
        <div class="header-actions">
          <button type="button" class="tool-button" id="directory" aria-label="Open employee directory" title="Directory"><svg><use href="#i-directory"/></svg><span>Directory</span></button>
          <button type="button" class="tool-button" id="memoryButton" aria-label="Open memory" title="Memory" aria-expanded="false" aria-controls="memoryPanel" disabled><svg><use href="#i-memory"/></svg><span>Memory</span></button>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="history" class="history" aria-label="Message history" tabindex="0">
        <div id="timeline" class="timeline"></div>
        <div id="welcome" class="welcome" hidden>
          <div class="welcome-avatar avatar" id="welcomeAvatar" aria-hidden="true"></div>
          <h2 id="welcomeTitle"></h2><p id="welcomeCopy"></p>
          <div id="starters" class="starters">
            <button type="button" id="intro">Ask for an introduction<svg><use href="#i-arrow"/></svg></button>
            <button type="button" id="brief">Share a brief<svg><use href="#i-arrow"/></svg></button>
          </div>
        </div>
      </div>
      <div class="compose-area">
        <div id="activity" class="activity" role="status"></div>
        <form id="composer" class="composer">
          <label class="sr-only" for="messageText">Message</label>
          <textarea rows="1" id="messageText" maxlength="16000" placeholder="Write a message…" disabled></textarea>
          <button class="send" type="submit" id="send" disabled aria-label="Send message" title="Send message"><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="compose-help"><span><svg><use href="#i-lock"/></svg>Private conversation</span><span><kbd>Enter</kbd> to send</span></div>
      </div>
    </main>
    <button type="button" class="memory-shade shade" id="memoryShade" aria-label="Close memory" hidden></button>
    <aside class="memory-panel" id="memoryPanel" aria-labelledby="memoryHeading" hidden>
      <header><div class="panel-heading"><svg><use href="#i-memory"/></svg><h2 id="memoryHeading">Memory</h2></div><button type="button" class="icon-button" id="closeMemory" aria-label="Close memory panel"><svg><use href="#i-close"/></svg></button></header>
      <div class="memory-body"><h3 id="memoryOwner"></h3><p class="muted">Saved notes from this employee’s conversations.</p><div id="memories"></div></div>
    </aside>
  </div>
  <dialog id="picker" aria-labelledby="pickerTitle">
    <div class="dialog-heading"><h2 id="pickerTitle">Directory</h2><button type="button" class="icon-button" id="closePicker" aria-label="Close directory"><svg><use href="#i-close"/></svg></button></div>
    <label class="search-field"><svg><use href="#i-search"/></svg><span class="sr-only">Search employees by name, handle, or role</span><input id="search" type="search" autocomplete="off" placeholder="Search by name, handle, or role"></label>
    <div id="results" class="results" aria-label="Employee results"></div>
  </dialog>
  <dialog id="noteEditor" aria-labelledby="noteTitle">
    <form id="noteForm">
      <div class="dialog-heading"><h2 id="noteTitle">Edit note</h2><button type="button" class="icon-button" id="closeNote" aria-label="Close note"><svg><use href="#i-close"/></svg></button></div>
      <label id="noteField" class="note-field"><span>Note</span><textarea id="noteText" maxlength="16000" rows="4" required></textarea></label>
      <div id="forgetPreview" hidden><p>This will remove the saved note from this employee’s memory.</p><blockquote id="forgetText"></blockquote></div>
      <p class="note-error" id="noteError" role="alert"></p>
      <div class="note-controls"><button type="button" class="tool-button" id="cancelNote">Cancel</button><button type="submit" id="saveNote" class="primary">Save changes</button></div>
    </form>
  </dialog>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
