<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f5f0" />
    <title>Company workspace · Perottino &amp; Co.</title>
    <link rel="stylesheet" href="/chat.css" />
    <script defer src="/workspace.js"></script>
    <script defer src="/files.js"></script>
    <script defer src="/settings.js"></script>
    <script defer src="/projects.js"></script>
    <script defer src="/mail.js"></script>
    <script defer src="/browsers.js"></script>
    <script defer src="/chat.js"></script>
  </head>
  <body>
    <a class="skip" href="#main-content">Skip to content</a>
    <header class="mobile-bar">
      <button id="menu" aria-controls="sidebar" aria-expanded="false">Menu</button
      ><span>Perottino &amp; Co.</span>
    </header>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P<span>.</span></span
        ><strong>Perottino &amp; Co.</strong>
      </div>
      <nav aria-label="Workspace">
        <a id="nav-dashboard" href="#dashboard"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <path d="m3 10 9-7 9 7v10H3z" />
            <path d="M9 20v-7h6v7" /></svg
          >Dashboard</a
        >
        <a id="nav-goals" href="#goals"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5" />
            <circle cx="12" cy="12" r="4.3" />
            <circle cx="12" cy="12" r="1" /></svg
          >Goals</a
        >
        <a id="nav-tasks" href="#tasks"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <path d="m8 12 2.7 2.8L16 9" /></svg
          >Tasks</a
        >
        <a id="nav-projects" href="#projects"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <rect x="3" y="6" width="18" height="15" rx="2" />
            <path d="M8 6V3h8v3M3 11h18" /></svg
          >Projects</a
        >
        <a id="nav-files" href="#files"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v12H3z" /></svg
          >Files</a
        >
        <a id="nav-activity" href="#activity"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <path d="M2 13h5l3-8 4 15 3-9 2 2h3" /></svg
          >Activity</a
        >
        <hr />
        <a id="nav-chat" href="#chat"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <path d="M4 5h16v12H9l-5 4z" />
            <path d="M8 9h8m-8 4h5" /></svg
          >Chat</a
        >
        <a id="nav-mail" href="#mail"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m4 7 8 6 8-6" /></svg
          >Email</a
        >
        <a id="nav-directory" href="#directory"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <rect x="6" y="3" width="14" height="18" rx="2" />
            <path d="M3 8h4m-4 8h4" />
            <circle cx="13" cy="9" r="2" />
            <path d="M9 16c.6-3 7.4-3 8 0" /></svg
          >Directory</a
        >
        <hr />
        <a id="nav-browsers" href="#browsers"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="15" rx="2" />
            <path d="M3 8h18M6 6h1m2 0h1" /></svg
          >Browsers</a
        >
        <a id="nav-settings" href="#settings"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <path d="M3 7h5m4 0h9M3 17h10m4 0h4" />
            <circle cx="10" cy="7" r="2" />
            <circle cx="15" cy="17" r="2" /></svg
          >Settings</a
        >
        <a id="nav-admin" href="#admin"
          ><svg aria-hidden="true" class="glyph" viewBox="0 0 24 24">
            <path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6z" />
            <path d="m9 12 2 2 4-5" /></svg
          >Admin</a
        >
      </nav>
      <div class="account">
        <span class="avatar owner-avatar" aria-hidden="true">O</span>
        <div><strong>Owner</strong><small>Private workspace</small></div>
      </div>
    </aside>
    <main id="main-content" tabindex="-1">
      <div id="notice" role="status" hidden></div>
      <header class="page-head">
        <div>
          <div class="wordline">Company workspace</div>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div id="page-actions" class="actions"></div>
      </header>
      <div id="content" aria-busy="true"></div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <header class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" type="button" aria-label="Close dialog" class="icon">×</button>
      </header>
      <div id="dialog-content"></div>
    </dialog>
    <template id="compose-template">
      <form id="composer">
        <label for="messageText">Message</label
        ><textarea
          id="messageText"
          rows="2"
          required
          maxlength="16000"
          placeholder="Write a message…"
        ></textarea>
        <div class="composer-foot">
          <div id="responders"></div>
          <button class="primary" type="submit" id="send">Send message</button>
        </div>
      </form>
    </template>
    <noscript>This workspace needs JavaScript to load company records and conversations.</noscript>
  </body>
</html>
